name: sql-regression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**']

jobs:
  pg-tap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: quay.io/abn/pgtap:1.3.1-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capacitagov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d capacitagov_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client and pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          container=$(docker ps --filter 'ancestor=quay.io/abn/pgtap:1.3.1-pg16' --format '{{.ID}}' | head -n 1)
          test -n "$container"
      - name: Apply migrations
        run: |
          container=$(docker ps --filter 'ancestor=quay.io/abn/pgtap:1.3.1-pg16' --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker cp "$GITHUB_WORKSPACE/supabase/migrations/." "$container:/tmp/capacitagov-migrations/"
          docker exec -i "$container" psql --username=postgres --dbname=capacitagov_test --set=ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create table if not exists auth.users (id uuid primary key, email text);
          create or replace function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          do $$ begin create role anon; exception when duplicate_object then null; end $$;
          do $$ begin create role authenticated; exception when duplicate_object then null; end $$;
          do $$ begin create role service_role; exception when duplicate_object then null; end $$;
          grant usage on schema auth to authenticated;
          grant insert, select on auth.users to authenticated;
          create schema if not exists storage;
          create table if not exists storage.buckets (id text primary key, name text not null, public boolean not null default false);
          create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text not null, name text not null);
          create or replace function storage.foldername(path text) returns text[] language sql immutable as $$ select string_to_array(path, '/') $$;
          SQL
          docker exec "$container" sh -lc 'set -eu; for migration in $(find /tmp/capacitagov-migrations -maxdepth 1 -type f -name "*.sql" ! -name "20261007_init.sql" | sort); do echo "Applying $migration"; psql --username=postgres --dbname=capacitagov_test --set=ON_ERROR_STOP=1 --file="$migration"; done'
      - name: Run pgTAP regression
        run: |
          container=$(docker ps --filter 'ancestor=quay.io/abn/pgtap:1.3.1-pg16' --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker cp "$GITHUB_WORKSPACE/supabase/tests/." "$container:/tmp/capacitagov-tests/"
          docker exec "$container" psql --username=postgres --dbname=capacitagov_test --set=ON_ERROR_STOP=1 --command='create extension if not exists pgtap;'
          docker exec "$container" sh -lc 'pg_prove --username=postgres --dbname=capacitagov_test /tmp/capacitagov-tests/*.sql'

