name: CapacitaGov checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/**'
      - 'ai/**'

permissions:
  contents: read

concurrency:
  group: capacitagov-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Security regression tests
        run: bun run test

      - name: Typecheck
        run: bun run lint

      - name: Build
        run: bun run build
