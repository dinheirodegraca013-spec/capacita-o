name: CapacitaGov web validation

on:
  push:
    branches: [main, feat/capacitagov-rebuild]
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/capacitagov-web.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
